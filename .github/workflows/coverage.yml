name: coverage

on: [ push, pull_request ]

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: install dependencies
      shell: bash
      run: sudo apt-get update && sudo apt-get -y install libcmocka-dev gcovr
    - name: build with coverage
      shell: bash
      run: |
        ./autogen.sh
        ./configure CFLAGS="-O0 -g --coverage" LDFLAGS="--coverage"
        # configure test programs leave coverage notes without sources
        rm -f ./*conftest*.gcno ./*conftest*.gcda
        make -j"$(nproc)"
    - name: unit tests
      shell: bash
      run: make -j"$(nproc)" check
    - name: coverage report
      shell: bash
      run: |
        mkdir -p coverage
        gcovr --root . --exclude 'tests/' \
              --html-details coverage/index.html --txt coverage/coverage.txt
        cat coverage/coverage.txt
        {
          echo '### Coverage, all sources'
          echo '```'
          gcovr --root . --exclude 'tests/' --print-summary \
                --json-summary coverage/summary.json
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
    - name: coverage gate (mstp.c at least 80 % lines, 65 % branches)
      shell: bash
      run: |
        gcovr --root . --filter 'mstp\.c$' --print-summary \
              --json-summary coverage/mstp-summary.json \
              --fail-under-line 80 --fail-under-branch 65 | tee gate.txt
        { echo '### Coverage, mstp.c'; echo '```'; cat gate.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
    - name: upload report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/
